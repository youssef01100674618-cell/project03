<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registeration</title>
    <link rel="stylesheet" href="registerstyle.css">
</head>
<body>
    <nav>
        <h1>Registeration</h1>
    </nav>
    <main>
        <div id="inMain">
            <h2>Registeration</h2>
        </div>
        <form>
            <pre> Username          </pre>
            <input type="text"  autofocus id="username">
             <p id="msgUsername" style="color : red"></p>
            <br>
            <br>
            <pre> Password          </pre>
            <input type="password"  id="password">
            <p id="msgPassword" style="color : red"></p>
            <br>
            <br>
            <pre> Confirm Password  </pre>
            <input type="password"  id="confirmPassword">
            <p id="msgConfirmPassword" style="color : red"></p>
            <br>
            <br>
            <pre> Age               </pre>
            <input type="number"  id="age">
             <p id="msgAge" style="color : red"></p>
            <br>
            <br>
            <pre>                </pre>
            <input type="submit" id="subm">
            <p id="msgValidation" style="color : greenyellow"></p>
        </form>
    </main>
    <script src="register.js"></script>
</body>
</html>
